<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1626" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // İlk boyamadan önce temayı uygula (koyu modda beyaz parlama olmasın)
      (function () {
        var t = null;
        try { t = localStorage.getItem('akillipark_theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-bs-theme', t);
      })();
    </script>
    <meta name="description" content="AkıllıPark - Görüntü İşleme Destekli Akıllı Otopark Sistemi" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AkıllıPark | Akıllı Otopark Sistemi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
